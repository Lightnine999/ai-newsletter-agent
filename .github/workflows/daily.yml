name: 매일 브리핑
# 실행 목록에서 '실제로 보내는 실행'을 골라낼 수 있게 이름을 나눈다 (예비 스케줄의 중복 방지에 쓴다)
run-name: ${{ inputs.dry_run && '브리핑 dry-run' || '브리핑 발송' }}

on:
  schedule:
    - cron: "30 22 * * *"         # ① UTC 22:30 = KST 07:30
    # GitHub 스케줄은 늦어지거나 아예 빠질 수 있다(2026-10-29 07:30 실제로 빠짐).
    # 예비 시각 두 개를 더 두고, 그날 이미 보냈으면 건너뛴다.
    - cron: "50 22 * * *"         #    예비 · KST 07:50
    - cron: "10 23 * * *"         #    예비 · KST 08:10
  workflow_dispatch:              # ② 손으로도 돌릴 수 있게
    inputs:
      dry_run:
        description: "발행하지 않고 로그만 남기기"
        type: boolean
        default: false

# 07:30 실행이 밀려 07:50 실행과 겹쳐도 한 번에 하나씩만 돌게 한다 (뒤 실행은 앞이 끝난 뒤 중복 확인)
concurrency:
  group: daily-briefing
  cancel-in-progress: false

permissions:
  contents: read
  actions: read                   # 오늘 실행 목록을 읽어 중복을 막는 데 쓴다

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20           # ③ 멈춰 있는 실행을 20분에서 끊는다
    steps:
      - name: 오늘 이미 보냈는지 확인 (스케줄 실행만)
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d "$(TZ=Asia/Seoul date +%Y-%m-%d) 00:00 +0900" +%Y-%m-%dT%H:%M:%SZ)
          # 스케줄로 보낸 것만 센다. 손으로 보낸 실행(시험·대신 발송)이 있어도 예약 시간에는 올린다
          sent=$(gh run list -R "$GITHUB_REPOSITORY" --workflow daily.yml --status success --event schedule \
                   --created ">=$since" --json databaseId,displayTitle \
                   --jq "[.[] | select(.displayTitle == \"브리핑 발송\" and .databaseId != $GITHUB_RUN_ID)] | length")
          echo "오늘(KST) 이미 보낸 실행: $sent"
          if [ "$sent" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip != 'true'
      - name: 브리핑 생성·발행
        if: steps.guard.outputs.skip != 'true'
        run: python run.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:                      # ④ 비밀값은 여기로만 들어간다
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TZ: Asia/Seoul
          DRY_RUN: "0"            # ⑤ 이 줄이 없으면 Actions에서는 한 번도 안 보낸다
